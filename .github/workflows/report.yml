# "Paste a link, get a report"
# Run it from GitHub: Actions → Get report → Run workflow (works in the GitHub mobile app too).
name: Get report

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "single = one account (link below); all = one combined report on the brand's competitors; each = one report per competitor"
        required: false
        default: single
        type: choice
        options: [single, all, each]
      profile_url:
        description: "Threads profile link or @handle (for scope = single)"
        required: false
        default: ""
        type: string
      brand:
        description: "Write post ideas for"
        required: true
        default: ines
        type: string
      focus:
        description: "Report type"
        required: true
        default: full
        type: choice
        options: [full, ideas, replies, voice]
      max_posts:
        description: "Top posts to analyze per account (the tracker collects about 1.7x more, max 100, and keeps the best)"
        required: true
        default: "30"
        type: choice
        options: ["30", "60", "100"]
      include_comments:
        description: "Also collect comments under the top 5 posts (about $0.15 more)"
        required: false
        default: false
        type: boolean
      model:
        description: "AI model: standard (Sonnet, best quality) or economy (Haiku, ~20x cheaper)"
        required: false
        default: standard
        type: choice
        options: [standard, economy]
      requested_by:
        description: "Who asked for it (filled in by the dashboard)"
        required: false
        default: ""
        type: string
      skip_collect:
        description: "Only write a new report from data already saved (no Apify cost)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: tracker-data-v2
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Collect posts and replies
        if: ${{ !inputs.skip_collect && (inputs.scope == 'single' || inputs.scope == '') }}
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          PROFILE_URL: ${{ inputs.profile_url }}
        run: |
          EXTRA=""
          if [ "${{ inputs.include_comments }}" = "true" ]; then EXTRA="--comments"; fi
          python scripts/tracker.py collect --handle "$PROFILE_URL" --max-posts ${{ inputs.max_posts }} $EXTRA

      - name: Refresh this brand's competitors (new posts only)
        if: ${{ !inputs.skip_collect && inputs.scope != 'single' && inputs.scope != '' }}
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          BRAND: ${{ inputs.brand }}
        run: python scripts/tracker.py refresh --brand "$BRAND"

      - name: Write the AI report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRACKER_MODEL: ${{ inputs.model }}
          PROFILE_URL: ${{ inputs.profile_url }}
          REQUESTED_BY: ${{ inputs.requested_by }}
          BRAND: ${{ inputs.brand }}
          SCOPE: ${{ inputs.scope || 'single' }}
        run: |
          if [ "$SCOPE" = "single" ]; then
            python scripts/tracker.py report --handle "$PROFILE_URL" --brand "$BRAND" --focus ${{ inputs.focus }} --top ${{ inputs.max_posts }} --requested-by "$REQUESTED_BY"
          else
            python scripts/tracker.py report --scope "$SCOPE" --brand "$BRAND" --focus ${{ inputs.focus }} --top ${{ inputs.max_posts }} --requested-by "$REQUESTED_BY"
          fi

      - name: Save to the repository
        if: always()
        env:
          PROFILE_URL: ${{ inputs.profile_url }}
          FOCUS: ${{ inputs.focus }}
          BRAND: ${{ inputs.brand }}
          REQUESTED_BY: ${{ inputs.requested_by }}
        run: |
          git config user.name "threads-tracker-bot"
          git config user.email "threads-tracker-bot@users.noreply.github.com"
          git add data reports config/accounts.json
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Report: ${PROFILE_URL:-all competitors} ($FOCUS, $BRAND) $REQUESTED_BY"
          git pull --rebase
          git push

      - name: Where to find it
        run: |
          echo "### Done" >> "$GITHUB_STEP_SUMMARY"
          echo "Open the dashboard → Reports, or the reports/ folder in the repository." >> "$GITHUB_STEP_SUMMARY"

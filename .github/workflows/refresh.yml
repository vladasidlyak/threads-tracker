# Digest every 2 weeks: refresh every account in config/accounts.json (only posts since the last refresh),
# write one combined report per ambassador (their own competitors) and a review of each ambassador's own account,
# then email the new reports (needs SMTP_USER, SMTP_PASSWORD, MAIL_TO secrets).
# Runs on the 1st and the 15th of each month around 06:40 Kyiv time (04:40 UTC), and on demand from the Actions tab.
name: Digest every 2 weeks

on:
  schedule:
    - cron: "40 4 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tracker-data-v2
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # latest commit when the run starts, not when it was queued

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Remember the start time
        run: echo "STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Refresh all accounts
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scripts/tracker.py refresh

      - name: Reports for each ambassador (competitors + own account)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/tracker.py monthly

      - name: Save to the repository
        if: always()
        run: |
          git config user.name "threads-tracker-bot"
          git config user.email "threads-tracker-bot@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Digest $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push

      - name: Email the reports
        if: always()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python scripts/digest.py --since "$STARTED"

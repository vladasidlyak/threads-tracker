# Find 10 competitors for a target account.
# Actions → Find competitors → Run workflow, or the Competitors tab on the dashboard.
name: Find competitors

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Your account (Threads link or @handle)"
        required: true
        type: string
      min_followers:
        description: "Ignore accounts smaller than"
        required: true
        default: "5000"
        type: choice
        options: ["1000", "5000", "10000", "30000"]
      keywords:
        description: "Optional: your own search terms, comma-separated (leave empty to let Claude choose)"
        required: false
        default: ""
        type: string
      requested_by:
        description: "Who asked for it (filled in by the dashboard)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: tracker-data
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Find competitors
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TARGET: ${{ inputs.target_url }}
          KEYWORDS: ${{ inputs.keywords }}
          REQUESTED_BY: ${{ inputs.requested_by }}
        run: python scripts/discover.py --handle "$TARGET" --min-followers ${{ inputs.min_followers }} --keywords "$KEYWORDS" --requested-by "$REQUESTED_BY"
      - name: Save to the repository
        if: always()
        env:
          TARGET: ${{ inputs.target_url }}
        run: |
          git config user.name "threads-tracker-bot"
          git config user.email "threads-tracker-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Competitors for $TARGET"
          git pull --rebase
          git push
